name: Compilar app iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master, mimoto-ios ]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: macos-15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ubicar el proyecto
        run: |
          PROYECTO=$(find . -maxdepth 3 -name "MiMoto.xcodeproj" -type d | head -1)
          if [ -z "$PROYECTO" ]; then echo "No se encontró MiMoto.xcodeproj"; exit 1; fi
          echo "CARPETA=$(dirname "$PROYECTO")" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Compilar la app (sin firmar)
        run: |
          cd "$CARPETA"
          xcodebuild \
            -project MiMoto.xcodeproj \
            -scheme MiMoto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar MiMoto.ipa
        run: |
          cd "$CARPETA"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiMoto.app Payload/
          # Firma básica (ad-hoc): Sideloadly/AltStore la reemplazan por la de tu Apple ID
          codesign --force --sign - --timestamp=none Payload/MiMoto.app
          codesign --verify --verbose=2 Payload/MiMoto.app
          zip -qry "$GITHUB_WORKSPACE/MiMoto.ipa" Payload

      - name: Publicar el archivo .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MiMoto-ipa
          path: MiMoto.ipa

      - name: Capturas en simulador iPhone 13
        continue-on-error: true
        run: |
          cd "$CARPETA"
          xcodebuild -project MiMoto.xcodeproj -scheme MiMoto -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build -quiet
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl create "iPhone 13 MiMoto" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/MiMoto.app
          DATOS=$(xcrun simctl get_app_container "$UDID" com.oscar.mimoto data)
          mkdir -p "$DATOS/Documents"
          cp "$GITHUB_WORKSPACE/.github/datos_demo.json" "$DATOS/Documents/moto.json"
          mkdir -p "$GITHUB_WORKSPACE/capturas"
          for t in 0 1 2 3 4; do
            xcrun simctl launch --terminate-running-process "$UDID" com.oscar.mimoto -pestanaInicial $t
            sleep 6
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/capturas/pestana_$t.png"
          done
          xcrun simctl launch --terminate-running-process "$UDID" com.oscar.mimoto -pestanaInicial 0 -abrirFormulario tanqueos
          sleep 6
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/capturas/formulario_tanqueo.png"
          xcrun simctl launch --terminate-running-process "$UDID" com.oscar.mimoto -pestanaInicial 3 -abrirFormulario mantenimientos
          sleep 6
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/capturas/formulario_mantenimiento.png"
          ls -la "$GITHUB_WORKSPACE/capturas"

      - name: Guardar MiMoto.ipa en la rama mimoto-ipa
        run: |
          mkdir -p /tmp/salida && cp "$GITHUB_WORKSPACE/MiMoto.ipa" /tmp/salida/
          cp -r "$GITHUB_WORKSPACE/capturas" /tmp/salida/ 2>/dev/null || true
          cd /tmp/salida
          git init -q -b mimoto-ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "MiMoto.ipa compilado desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mimoto-ipa
