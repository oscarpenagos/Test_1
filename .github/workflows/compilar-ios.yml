name: Compilar app iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master, mimoto-ios ]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: macos-15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ubicar el proyecto
        run: |
          PROYECTO=$(find . -maxdepth 3 -name "MiMoto.xcodeproj" -type d | head -1)
          if [ -z "$PROYECTO" ]; then echo "No se encontró MiMoto.xcodeproj"; exit 1; fi
          echo "CARPETA=$(dirname "$PROYECTO")" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Compilar la app (sin firmar)
        run: |
          cd "$CARPETA"
          xcodebuild \
            -project MiMoto.xcodeproj \
            -scheme MiMoto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar MiMoto.ipa
        run: |
          cd "$CARPETA"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiMoto.app Payload/
          # Firma básica (ad-hoc): Sideloadly/AltStore la reemplazan por la de tu Apple ID
          codesign --force --sign - --timestamp=none Payload/MiMoto.app
          codesign --verify --verbose=2 Payload/MiMoto.app
          zip -qry "$GITHUB_WORKSPACE/MiMoto.ipa" Payload

      - name: Publicar el archivo .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MiMoto-ipa
          path: MiMoto.ipa

      - name: Guardar MiMoto.ipa en la rama mimoto-ipa
        run: |
          mkdir -p /tmp/salida && cp "$GITHUB_WORKSPACE/MiMoto.ipa" /tmp/salida/
          cd /tmp/salida
          git init -q -b mimoto-ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add MiMoto.ipa
          git commit -q -m "MiMoto.ipa compilado desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mimoto-ipa
